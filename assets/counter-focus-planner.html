<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Planner · Counter</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f6f6ee;color:#1c2a39;margin:0}main{max-width:850px;background:white;margin:35px auto;padding:40px;border:1px solid #ddd;border-radius:14px}h1{font-size:44px;letter-spacing:-.05em;margin-bottom:4px}h2{font-size:22px;margin-top:35px}.muted{color:#6e796f}label{display:block;font-size:13px;font-weight:700;color:#536276;margin:16px 0 5px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d6d2;border-radius:6px}textarea{height:80px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.day{padding:14px;border:1px solid #dce1da;border-radius:8px}.day h3{margin:0 0 8px;font-size:15px}button{background:#1c2a39;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;margin-top:25px}footer{font-size:12px;color:#6e796f;margin-top:35px}@media(max-width:600px){main{margin:0;padding:22px}.grid{display:block}.day{margin:10px 0}}@media print{body{background:white}main{border:0;margin:0;padding:0}button,.tip{display:none}input,textarea{border:0;border-bottom:1px solid #ddd;padding:3px;resize:none}.day{break-inside:avoid}}</style>
<main><p class="muted">COUNTER STUDIO / DIGITAL TOOL</p><h1>Focus Planner</h1><p class="tip">Plan a week, keep it on this device, or print it. Your entries never leave your browser.</p><label>Week beginning</label><input id="week" type="date"><h2>Three priorities</h2><div class="grid"><div><label>1. Most important</label><input id="priority1" placeholder="The one thing that matters"></div><div><label>2. Next</label><input id="priority2" placeholder="A meaningful step"></div><div><label>3. If time allows</label><input id="priority3" placeholder="An extra win"></div><div><label>What can wait?</label><input id="later" placeholder="Something to set aside"></div></div><h2>Daily plan</h2><div class="grid" id="days"></div><h2>End-of-week review</h2><label>What moved forward?</label><textarea id="wins"></textarea><label>What will I change next week?</label><textarea id="next"></textarea><button class="tip" id="print">Print / Save PDF</button><footer>Focus Planner by Counter Studio. A printable planning tool; no subscription or external account required.</footer></main>
<script>const key='counter-focus-planner-v1';const $=id=>document.getElementById(id);const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};for(const day of days){const card=document.createElement('div');card.className='day';const title=document.createElement('h3');title.textContent=day;card.append(title);const task=document.createElement('input');task.id=day.toLowerCase();task.placeholder='Main focus';task.setAttribute('aria-label',day+' focus');card.append(task);$('days').append(card)}for(const id of ['week','priority1','priority2','priority3','later','wins','next',...days.map(x=>x.toLowerCase())]){$(id).value=saved[id]||'';$(id).oninput=()=>{saved[id]=$(id).value;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}}$('print').onclick=()=>window.print();</script></html>
